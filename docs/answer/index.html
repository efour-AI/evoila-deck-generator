<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hub answer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#1F1534;--indigo:#0D09B5;--blue:#0075E4;--green:#0BD7A1;--bg:#F6F0EB;--card:#fff;--ink:#1F1534;--muted:#6B6478;--line:#E4DDD6;--soft:#FBF8F5;--ok:#0F8F6A;--okbg:#DDF7EE;--bad:#B42318;--badbg:#FDE8E7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17102A;--card:#231A3B;--ink:#F3EEF8;--muted:#B5ACC4;--line:#3A3052;--soft:#2A2046;--okbg:#0F3B30;--ok:#7BE8C6;--badbg:#4A1A1A;--bad:#FF9C93;--blue:#8FB8FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
header{background:var(--violet);color:#fff;padding:16px 16px 22px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:22px;width:auto;display:block}
.back{color:rgba(255,255,255,.85);text-decoration:none;font-size:13.5px;font-weight:600}
.who{display:flex;gap:14px;align-items:center;margin-top:16px}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;background:linear-gradient(135deg,var(--green),var(--blue)) center/cover no-repeat}
h1{font-size:22px;margin:0}
.sub{color:rgba(255,255,255,.72);margin:2px 0 0;font-size:13.5px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pick a{font-size:12.5px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;text-decoration:none}
.pick a.on{background:#fff;color:var(--violet)}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
.card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.card h2:first-child{margin-top:0}
.card p{margin:0 0 8px}
.card ul{margin:0 0 8px;padding-left:20px}
.card li{margin:3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.hint{font-size:13px;color:var(--muted)}
label.l{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
textarea{width:100%;min-height:110px;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:15px;border:0;border-radius:10px;padding:12px 18px;color:#fff;background:var(--indigo);cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{padding:12px 14px;border-radius:10px;margin:0 0 12px;font-size:14px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}
.loading{color:var(--muted);text-align:center;padding:30px 0}
.hidden{display:none}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 6px}
.meta{font-size:13px;color:var(--muted);margin:0 0 14px}
.ans{white-space:pre-wrap;font-size:15px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<header><div class="wrap">

 32.57ZM47.6 22.68C47.6 18.03 50.88 16.69 55.77 16.69 58.6 16.69 60.37 17.58 60.76 19.45 61.22 21.8 58.72 23.62 53.76 25.03 50.88 25.84 49.25 26.16 47.6 26.61L47.6 22.68 47.6 22.68Z" fill="#FFFFFF"/></g></g></svg><a class="back" href="../">← Marketing hub</a></div>
 <div class="who"><div><h1>Ask the hub</h1><p class="sub">A question someone asked, and the answer the hub gave</p></div></div>
</div></header>
<main class="wrap">
 <div id="flash"></div>
 <div class="card hidden" id="box">
  <p class="q" id="q"></p>
  <p class="meta" id="meta"></p>
  <div class="ans" id="a"></div>
  <div class="row"><button class="btn" id="copy" type="button">Copy link</button><a class="btn ghost" href="../">Ask your own question</a></div>
 </div>
 <p class="hint">Answers come from evoila's documents and recent team meetings. Check anything marked internal before sharing outside evoila.</p>
</main>
<script>
const ACT="https://hook.us2.make.com/91mst8q1pr5j2smjck26k4a23tlrcrn8";
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=s=>document.querySelector(s);
function flash(t,k){const d=$("#flash");d.innerHTML="";if(t){const m=document.createElement("div");m.className="msg "+(k||"ok");m.textContent=t;d.appendChild(m);}}
let token=null;const h=new URLSearchParams(location.hash.slice(1));
if(h.get("k")){token=h.get("k");store("evoila_hub","k:"+token);}else if(h.get("t")){token=h.get("t");store("evoila_hub","t:"+token);}
else{const s=load("evoila_hub");if(s)token=s.slice(2);else token=load("evoila_desk_t");}
if(h.toString())history.replaceState(null,"",location.pathname+location.search);
const id=new URLSearchParams(location.search).get("id")||"";
function fmt(d){return d?new Date(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";}
(async()=>{
  if(!token){flash("Open this from your personal hub link first.","err");return;}
  try{
    const r=await fetch(ACT,{method:"POST",body:new URLSearchParams({t:token,a:"answer",id})});const tx=await r.text();let j=null;try{j=JSON.parse(tx)}catch(e){}
    if(r.status===401){flash("This link isn't recognized. Use the personal link Kevin sent you.","err");return;}
    if(!j||!j.answer){flash("That answer isn't available.","err");return;}
    const f=j.answer;$("#q").textContent=f.Item||"Question";
    $("#meta").textContent="Asked by "+(f.Person||"someone")+(f.When?" · "+fmt(f.When):"");
    $("#a").textContent=f.Answer||"The answer for this question wasn't saved. Answers are kept for questions asked from 27 Oct 2026 on.";
    $("#box").classList.remove("hidden");document.title="Hub answer: "+(f.Item||"").slice(0,60);
  }catch(e){flash("Couldn't load this just now. Refresh in a minute.","err");}
})();
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+"?id="+id);$("#copy").textContent="Link copied";}catch(e){$("#copy").textContent="Copy failed";}};
</script>
