name: Build walking deck

# Fired by Airtable automations (repository_dispatch):
#   build-deck     - "Deck request: plan and build" (record = Deck Requests row)
#   check-library  - "Slide library: check new version" (record = Slide Library Versions row)
# or by hand from the Actions tab (workflow_dispatch).
on:
  repository_dispatch:
    types: [build-deck, check-library]
  workflow_dispatch:
    inputs:
      record_id:
        description: "Record ID (rec...)"
        required: true
      mode:
        description: "build-deck or check-library"
        required: false
        default: build-deck

concurrency:
  group: deck-${{ github.event.client_payload.record_id || github.event.inputs.record_id }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RECORD_ID: ${{ github.event.client_payload.record_id || github.event.inputs.record_id }}
      MODE: ${{ github.event.action || github.event.inputs.mode || 'build-deck' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and fonts
        timeout-minutes: 7
        run: |
          for i in 1 2 3; do sudo timeout 120 apt-get update -qq -o Acquire::Retries=3 && break; echo "apt update retry $i"; sleep 5; done
          sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 libreoffice-impress fonts-inter fonts-crosextra-carlito > /dev/null
          mkdir -p ~/.config/fontconfig
          cp fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q python-pptx==1.0.2 python-docx==1.2.0 pillow lxml cairosvg==2.9.1

      - name: Build deck
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python run_request.py

      - name: Flag the row if the server failed
        if: failure() || cancelled()
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 run_request.py --mark-failed
