<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The evoila template uses Aptos (Microsoft). Render PDFs with Inter, the closest open font. -->
  <alias binding="same"><family>Aptos</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Aptos SemiBold</family><prefer><family>Inter SemiBold</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
